<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kick Miner</title>
<style>
  :root{
    --bg:#23252f; --panel:#2b2d3e; --panel2:#343e59; --panel3:#3c4467;
    --border:#3a3d52; --fg:#f5f6fa; --fg2:#c7cad8; --muted:#8b8fa3;
    --accent:#f9826c; --accent-dim:rgba(249,130,108,.15);
    --green:#53fc18; --green-dim:rgba(83,252,24,.14);
    --orange:#faa61a; --red:#f04747;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter','Segoe UI',-apple-system,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;font-size:14px}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px 48px}
  header{display:flex;align-items:baseline;gap:14px;padding:24px 0 14px;flex-wrap:wrap}
  header h1{font-size:24px;font-weight:800;letter-spacing:1px}
  header h1 .k{color:var(--green)}
  header .ver{color:var(--muted);font-size:11px}
  header .spacer{flex:1}
  header .clock{color:var(--muted);font-size:12px}

  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 16px;min-width:104px;flex:1}
  .stat .v{font-size:20px;font-weight:700}
  .stat .v.accent{color:var(--accent)}
  .stat .v.green{color:var(--green)}
  .stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:3px}

  .nowwatch{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--green);
            border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--fg2)}
  .nowwatch b{color:var(--green)}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px}
  .tabs button{background:none;border:none;color:var(--muted);padding:10px 16px;font-size:13px;font-weight:600;
               cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.3px}
  .tabs button:hover{color:var(--fg2)}
  .tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}

  .box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .row{display:flex;gap:16px;align-items:flex-start}
  @media(max-width:820px){.row{flex-direction:column}}

  /* points tab */
  .slist{width:210px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;max-height:420px;overflow:auto}
  .slist button{background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--fg2);
                text-align:left;padding:9px 12px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:8px}
  .slist button:hover{background:var(--panel3);color:var(--fg)}
  .slist button.on{border-color:var(--accent);color:var(--fg);background:var(--panel3)}
  .slist button .p{color:var(--muted);font-size:11px}
  .chartwrap{flex:1;min-width:0}
  .ranges{display:flex;gap:4px;margin-bottom:10px}
  .ranges button{background:var(--panel2);border:1px solid var(--border);color:var(--fg2);border-radius:7px;
                 padding:4px 10px;font-size:12px;cursor:pointer}
  .ranges button.on{border-color:var(--accent);color:var(--fg)}
  svg.chart{display:block;width:100%;height:300px}
  .grid line{stroke:var(--border);stroke-width:1}
  .axis-t{fill:var(--muted);font-size:10px}
  .cline{fill:none;stroke:var(--accent);stroke-width:2}
  .carea{fill:url(#g-accent)}
  .cdot{fill:var(--accent)}
  .crosshair{stroke:var(--fg2);stroke-width:1;stroke-dasharray:3 3}
  .chart-cap{text-align:center;color:var(--fg2);font-size:12px;margin-top:8px}
  .tip{position:absolute;background:var(--panel3);border:1px solid var(--border);border-radius:6px;
       padding:5px 9px;font-size:12px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-115%);display:none;z-index:5}

  /* account cards (points tab, below) */
  .acc{margin-top:16px}
  .acc h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--fg2);margin-bottom:8px;display:flex;gap:10px;flex-wrap:wrap}
  .acc h3 .alias{color:var(--accent)}
  .acc h3 .meta{margin-left:auto;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .card{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:11px 13px;position:relative;overflow:hidden}
  .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--border)}
  .card.watching::before{background:var(--green)}
  .card.online::before{background:var(--orange)}
  .card .t{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .card .dot{width:7px;height:7px;border-radius:50%;background:#666;flex-shrink:0}
  .card.watching .dot{background:var(--green);box-shadow:0 0 7px rgba(83,252,24,.6)}
  .card.online .dot{background:var(--orange)}
  .card .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .pr{font-size:9px;background:var(--border);color:var(--muted);padding:1px 5px;border-radius:4px}
  .card .b{display:flex;justify-content:space-between;align-items:baseline}
  .card .pts{font-size:16px;font-weight:700;color:var(--green)}
  .card .g{font-size:11px;color:var(--fg2)}
  .card .st{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .card.watching .st{color:var(--green)} .card.online .st{color:var(--orange)}

  /* config tab */
  .cfgnote{color:var(--orange);font-size:12px;margin-bottom:14px;display:flex;gap:6px;align-items:center}
  .cfgacc{margin-bottom:16px}
  .cfgacc .head{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .cfgacc .head .alias{font-weight:700;color:var(--accent)}
  .limit{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2)}
  .limit input{width:56px;background:var(--panel2);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:4px 6px}
  .tokrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .tbadge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;letter-spacing:.3px}
  .tbadge.ok{background:var(--green-dim);color:var(--green);border:1px solid rgba(83,252,24,.35)}
  .tbadge.bad{background:rgba(240,71,71,.15);color:var(--red);border:1px solid rgba(240,71,71,.4)}
  .tbadge.unk{background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
  .thint{font-size:11px;color:var(--muted);font-family:Consolas,monospace}
  .addf{display:flex;gap:6px;margin-bottom:10px}
  .addf input{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--fg);border-radius:7px;padding:7px 10px;font-size:13px}
  button.btn{background:var(--accent);border:none;color:#1a1a1a;font-weight:700;border-radius:7px;padding:7px 14px;cursor:pointer;font-size:13px}
  button.btn.ghost{background:var(--panel2);color:var(--fg2);border:1px solid var(--border)}
  button.btn.danger{background:none;border:1px solid var(--red);color:var(--red);padding:4px 10px;font-weight:600}
  button.btn:disabled{opacity:.5;cursor:not-allowed}
  .sitem{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);
         border-radius:8px;padding:7px 10px;margin-bottom:5px}
  .sitem .grip{cursor:grab;color:var(--muted);font-size:14px;line-height:1;user-select:none;
               padding:0 2px;letter-spacing:-2px}
  .sitem .grip:active{cursor:grabbing}
  .sitem .idx{color:var(--muted);font-size:11px;width:20px;text-align:right}
  .sitem .nm{flex:1;font-size:13px}
  .sitem.sortable-ghost{opacity:.4;border-style:dashed;border-color:var(--accent)}
  .sitem.sortable-chosen{background:var(--panel3)}
  .rm-acct{margin-left:auto}
  .add-acct{border-top:1px solid var(--border);margin-top:18px;padding-top:16px}
  .add-acct h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg2);margin-bottom:10px}
  .add-acct .row2{display:flex;gap:6px;flex-wrap:wrap}
  .add-acct input{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--border);
                  color:var(--fg);border-radius:7px;padding:7px 10px;font-size:13px}
  .err{color:var(--red);font-size:12px;margin-top:6px;min-height:16px}

  /* log tab */
  .logbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  pre.log{background:#1c1d26;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:11.5px;
          line-height:1.5;height:460px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:'JetBrains Mono',Consolas,monospace;color:var(--fg2)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="k">KICK</span> MINER</h1>
    <span class="ver" id="ver"></span>
    <span class="spacer"></span>
    <span class="clock">updated <span id="clock">--:--:--</span></span>
  </header>

  <div class="stats" id="stats"></div>
  <div class="nowwatch" id="nowwatch">Not watching anything yet.</div>

  <div class="tabs">
    <button data-tab="points" class="on">Points</button>
    <button data-tab="config">Config</button>
    <button data-tab="log">Log</button>
  </div>

  <!-- POINTS -->
  <section id="tab-points">
    <div class="box">
      <div class="row">
        <div class="slist" id="slist"></div>
        <div class="chartwrap">
          <div class="ranges" id="ranges">
            <button data-h="6">6h</button>
            <button data-h="24" class="on">24h</button>
            <button data-h="72">3d</button>
            <button data-h="168">7d</button>
          </div>
          <div style="position:relative">
            <svg class="chart" id="chart" viewBox="0 0 1000 300" preserveAspectRatio="none"></svg>
            <div class="tip" id="tip"></div>
          </div>
          <div class="chart-cap" id="chartcap"></div>
        </div>
      </div>
    </div>
    <div id="accts"></div>
  </section>

  <!-- CONFIG -->
  <section id="tab-config" hidden>
    <div class="box">
      <div class="cfgnote">⚠ Saving a change restarts the miner (a few seconds of downtime).</div>
      <div id="cfgbody"></div>
      <div class="err" id="cfgerr"></div>
    </div>
  </section>

  <!-- LOG -->
  <section id="tab-log" hidden>
    <div class="box">
      <div class="logbar">
        <button class="btn ghost" id="logpause">Pause</button>
        <span style="color:var(--muted);font-size:12px">tail of logs/kickminer.log · refreshes 3s</span>
      </div>
      <pre class="log" id="logbox">loading…</pre>
    </div>
  </section>
</div>

<script src="/static/sortable.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const fmt = n => (n||0).toLocaleString();
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function millify(n){n=+n||0;const u=['','k','M','B'];let i=0;while(Math.abs(n)>=1000&&i<3){n/=1000;i++;}
  return (Math.round(n*100)/100).toString().replace(/\.0+$/,'')+u[i];}

let TAB='points', PICK=null, RANGE=24, DATA=null, LOGPAUSE=false;

/* ---- tabs ---- */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  TAB=b.dataset.tab;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  for(const t of ['points','config','log']) $('#tab-'+t).hidden = (t!==TAB);
  if(TAB==='config') loadConfig();
  if(TAB==='log') pullLog();
});

/* ---- stats + now-watching + cards ---- */
function renderData(d){
  DATA=d;
  let watching=0, online=0;
  for(const a of d.accounts||[]) for(const s of Object.values(a.streamers||{})){
    if(s.watching) watching++; else if(s.online) online++;
  }
  $('#stats').innerHTML='';
  [['ACTIVE','',(d.accounts||[]).length+' acct'],
   [watching,'green','watching'],
   [watching+online,'','online'],
   [millify(d.grand_total),'green','total points'],
   ['+'+fmt(d.session_gain),'accent','this session']
  ].forEach(([v,c,l])=>{
    const s=el('div','stat'); s.appendChild(el('div','v '+c,v)); s.appendChild(el('div','l',l)); $('#stats').appendChild(s);
  });

  const nw=d.now_watching||[];
  $('#nowwatch').innerHTML = nw.length
    ? 'Watching: '+nw.map(w=>`<b>${w.streamer}</b> <span style="color:var(--muted)">(${w.account}, ${fmt(w.points)} pts)</span>`).join(' · ')
    : 'Not watching anything right now.';

  // streamer picker
  const names=d.history_streamers||[];
  const sl=$('#slist');
  if(sl.dataset.sig!==names.join(',')){
    sl.dataset.sig=names.join(','); sl.innerHTML='';
    names.forEach(n=>{
      const b=el('button',null,`<span>${n}</span><span class="p"></span>`);
      b.onclick=()=>{PICK=n;markPick();drawChart();};
      b.dataset.n=n; sl.appendChild(b);
    });
    if(!PICK && names.length) PICK=names[0];
    markPick();
  }
  // account cards
  const box=$('#accts'); box.innerHTML='';
  for(const a of d.accounts||[]){
    const wrap=el('div','acc');
    const up=a.uptime_seconds||0, h=Math.floor(up/3600), m=Math.floor(up%3600/60);
    wrap.appendChild(el('h3',null,
      `<span class="alias">${a.alias}</span>`+
      `<span class="meta">${a.proxy?'proxy':'direct'} · ${a.active_count}/${a.max_concurrent} · up ${h}h ${m}m · ${fmt(a.total_points)} pts</span>`));
    const g=el('div','cards');
    (a.streamer_order||Object.keys(a.streamers||{})).forEach(n=>{
      const s=(a.streamers||{})[n]||{};
      let cls='card',st='offline';
      if(s.watching){cls+=' watching';st='watching';}
      else if(s.online){cls+=' online';st='queued';}
      const c=el('div',cls);
      c.appendChild(el('div','t',
        `<span class="dot"></span><span class="nm"><a href="https://kick.com/${n}" target="_blank" rel="noopener">${n}</a></span><span class="pr">#${s.priority??'?'}</span>`));
      c.appendChild(el('div','b',
        `<span class="pts">${fmt(s.points)} <span class="g">(+${fmt(s.points_gained)})</span></span><span class="st">${st}</span>`));
      g.appendChild(c);
    });
    wrap.appendChild(g); box.appendChild(wrap);
  }
}
function markPick(){document.querySelectorAll('#slist button').forEach(b=>b.classList.toggle('on',b.dataset.n===PICK));}

/* ---- chart ---- */
$('#ranges').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  RANGE=+b.dataset.h;
  $('#ranges').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  drawChart();
});
let CHART=[];
async function drawChart(){
  const svg=$('#chart'), cap=$('#chartcap');
  if(!PICK){svg.innerHTML='';cap.textContent='No data yet.';return;}
  let j; try{ j=await (await fetch(`/api/history?streamer=${encodeURIComponent(PICK)}&hours=${RANGE}`)).json(); }catch(e){return;}
  const pts=(j.points||[]).map(p=>({t:p.ts*1000,y:p.balance}));
  CHART=pts;
  if(pts.length<2){svg.innerHTML='';cap.textContent=`${PICK}: not enough data yet.`;return;}
  const W=1000,H=300,L=56,R=14,T=14,B=26;
  const xs=pts.map(p=>p.t), ys=pts.map(p=>p.y);
  const x0=Math.min(...xs),x1=Math.max(...xs);
  let y0=Math.min(...ys),y1=Math.max(...ys); if(y0===y1){y0-=1;y1+=1;}
  const sx=t=>L+(t-x0)/(x1-x0)*(W-L-R);
  const sy=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const line=pts.map((p,i)=>(i?'L':'M')+sx(p.t).toFixed(1)+' '+sy(p.y).toFixed(1)).join(' ');
  const area=line+` L ${sx(x1).toFixed(1)} ${sy(y0).toFixed(1)} L ${sx(x0).toFixed(1)} ${sy(y0).toFixed(1)} Z`;
  const tf=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
  const gy=[0,.25,.5,.75,1].map(f=>{const y=(T+f*(H-T-B)).toFixed(1);return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/>`}).join('');
  const yt=[y0,(y0+y1)/2,y1].map(v=>`<text class="axis-t" x="${L-8}" y="${(sy(v)+3).toFixed(1)}" text-anchor="end">${millify(Math.round(v))}</text>`).join('');
  const xt=[x0,(x0+x1)/2,x1].map(t=>`<text class="axis-t" x="${sx(t).toFixed(1)}" y="${H-6}" text-anchor="middle">${tf(t)}</text>`).join('');
  svg.innerHTML=`<defs><linearGradient id="g-accent" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="var(--accent)" stop-opacity="0.35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <g class="grid">${gy}</g>
    <path class="carea" d="${area}"/><path class="cline" d="${line}" vector-effect="non-scaling-stroke"/>
    ${yt}${xt}
    <line class="crosshair" id="ch" x1="0" y1="${T}" x2="0" y2="${H-B}" style="display:none"/>
    <circle class="cdot" id="cd" r="3" style="display:none"/>`;
  cap.textContent=`${PICK} · ${fmt(ys[0])} → ${fmt(ys[ys.length-1])} pts (+${fmt(ys[ys.length-1]-ys[0])})`;
  svg._sx={x0,x1,L,R,W};
}
$('#chart').addEventListener('mousemove',e=>{
  const svg=$('#chart'); if(!CHART.length||!svg._sx)return;
  const r=svg.getBoundingClientRect();
  const px=(e.clientX-r.left)/r.width*1000;
  const {x0,x1,L,R,W}=svg._sx;
  const frac=Math.max(0,Math.min(1,(px-L)/(W-L-R)));
  const tt=x0+frac*(x1-x0);
  let best=CHART[0]; for(const p of CHART) if(Math.abs(p.t-tt)<Math.abs(best.t-tt)) best=p;
  const cx=L+(best.t-x0)/(x1-x0)*(W-L-R);
  const ys=CHART.map(p=>p.y); let y0=Math.min(...ys),y1=Math.max(...ys); if(y0===y1){y0-=1;y1+=1;}
  const cy=14+(1-(best.y-y0)/(y1-y0))*(300-14-26);
  const ch=$('#ch'),cd=$('#cd');
  if(ch){ch.style.display='';ch.setAttribute('x1',cx);ch.setAttribute('x2',cx);}
  if(cd){cd.style.display='';cd.setAttribute('cx',cx);cd.setAttribute('cy',cy);}
  const tip=$('#tip');
  tip.style.display='block';
  tip.style.left=(cx/1000*r.width)+'px';
  tip.style.top=(cy/300*r.height)+'px';
  tip.textContent=`${fmt(best.y)} pts · ${new Date(best.t).toLocaleTimeString()}`;
});
$('#chart').addEventListener('mouseleave',()=>{
  $('#tip').style.display='none';
  const ch=$('#ch'),cd=$('#cd'); if(ch)ch.style.display='none'; if(cd)cd.style.display='none';
});

/* ---- config editor ---- */
let CFG=null, BUSY=false;
async function loadConfig(){
  try{ CFG=await (await fetch('/api/config')).json(); }catch(e){return;}
  renderConfig();
}
function cfgErr(m){$('#cfgerr').textContent=m||'';}
async function cfgAction(body){
  if(BUSY)return; BUSY=true; cfgErr('');
  document.querySelectorAll('#cfgbody button,#cfgbody input').forEach(x=>x.disabled=true);
  try{
    const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok){ cfgErr(j.error||'Edit rejected.'); }
    else{ CFG=j.config; if(j.restarting) cfgErr('Saved — miner restarting…'); }
  }catch(e){ cfgErr('Request failed.'); }
  BUSY=false; renderConfig();
}
function renderConfig(){
  const body=$('#cfgbody'); body.innerHTML='';
  if(!CFG||!CFG.accounts){body.textContent='No editable accounts.';return;}
  const many=CFG.accounts.length>1;

  CFG.accounts.forEach(acc=>{
    const w=el('div','cfgacc');
    const head=el('div','head');
    head.appendChild(el('span','alias',acc.alias));
    const lim=el('label','limit','max concurrent ');
    const inp=el('input'); inp.type='number'; inp.min=1; inp.max=50; inp.value=acc.max_concurrent;
    inp.onchange=()=>cfgAction({action:'set_limit',account:acc.alias,max_concurrent:+inp.value});
    lim.appendChild(inp); head.appendChild(lim);
    const ra=el('button','btn danger rm-acct','Remove account'); ra.type='button'; ra.disabled=!many;
    ra.onclick=()=>{ if(confirm('Remove account "'+acc.alias+'" from the miner?')) cfgAction({action:'remove_account',account:acc.alias}); };
    head.appendChild(ra);
    w.appendChild(head);

    // --- token row ---
    const live=(DATA&&DATA.accounts||[]).find(a=>a.alias===acc.alias)||{};
    const tv=live.token_valid;
    const trow=el('div','tokrow');
    let badge='<span class="tbadge unk">token — not checked</span>';
    if(tv===true)  badge=`<span class="tbadge ok">token valid${live.token_username?' · '+live.token_username:''}</span>`;
    if(tv===false) badge='<span class="tbadge bad">token invalid / expired</span>';
    trow.innerHTML=`${badge}<span class="thint">${acc.token_hint||'no token'}</span>`;
    const tb=el('button','btn ghost','Update token'); tb.type='button';
    tb.onclick=()=>{
      const v=prompt('Paste the new Kick bearer token for "'+acc.alias+'"\n(format 123456|abcdef… — from F12 → Network → authorization header)');
      if(v && v.trim()) cfgAction({action:'set_token',account:acc.alias,token:v.trim()});
    };
    trow.appendChild(tb);
    w.appendChild(trow);

    const f=el('form','addf');
    const ai=el('input'); ai.placeholder='add kick channel…'; ai.maxLength=25; ai.autocomplete='off';
    const ab=el('button','btn','Add'); ab.type='submit';
    f.appendChild(ai); f.appendChild(ab);
    f.onsubmit=e=>{e.preventDefault(); const v=ai.value.trim(); if(v) cfgAction({action:'add',account:acc.alias,streamer:v});};
    w.appendChild(f);

    const list=el('div','slist-cfg'); list.dataset.account=acc.alias;
    acc.streamers.forEach((n,i)=>{
      const it=el('div','sitem'); it.dataset.name=n;
      it.appendChild(el('span','grip','⠿'));
      it.appendChild(el('span','idx','#'+i));
      it.appendChild(el('span','nm',n));
      const rm=el('button','btn danger','Remove'); rm.type='button';
      rm.onclick=()=>cfgAction({action:'remove',account:acc.alias,streamer:n});
      it.appendChild(rm);
      list.appendChild(it);
    });
    if(!acc.streamers.length) list.appendChild(el('div',null,'<span style="color:var(--muted);font-size:12px">No streamers.</span>'));
    w.appendChild(list);
    body.appendChild(w);

    if(window.Sortable && acc.streamers.length>1){
      Sortable.create(list,{handle:'.grip',animation:150,ghostClass:'sortable-ghost',chosenClass:'sortable-chosen',
        onEnd:evt=>{
          if(evt.oldIndex===evt.newIndex) return;
          const order=[...list.querySelectorAll('.sitem')].map(x=>x.dataset.name);
          cfgAction({action:'reorder',account:acc.alias,streamers:order});
        }});
    }
  });

  // --- add account ---
  const add=el('div','add-acct');
  add.appendChild(el('h4','','Add a Kick account'));
  const af=el('form','row2');
  const na=el('input'); na.placeholder='account name (e.g. Alt)'; na.maxLength=40;
  const nt=el('input'); nt.placeholder='bearer token  123456|abcdef…'; nt.autocomplete='off';
  const nb=el('button','btn','Add account'); nb.type='submit';
  af.appendChild(na); af.appendChild(nt); af.appendChild(nb);
  af.onsubmit=e=>{e.preventDefault(); if(na.value.trim()&&nt.value.trim())
    cfgAction({action:'add_account',alias:na.value.trim(),token:nt.value.trim()});};
  add.appendChild(af);
  body.appendChild(add);
}

/* ---- log ---- */
$('#logpause').onclick=()=>{LOGPAUSE=!LOGPAUSE;$('#logpause').textContent=LOGPAUSE?'Resume':'Pause';};
async function pullLog(){
  if(LOGPAUSE)return;
  try{
    const t=await (await fetch('/api/log?bytes=60000')).text();
    const box=$('#logbox'); const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<40;
    box.textContent=t||'(log empty)';
    if(atBottom) box.scrollTop=box.scrollHeight;
  }catch(e){}
}

/* ---- loop ---- */
async function tick(){
  try{
    const d=await (await fetch('/api/data')).json();
    renderData(d);
    $('#clock').textContent=new Date().toLocaleTimeString();
    if(TAB==='points') drawChart();
    // refresh the Config tab only when a token badge changed and the user
    // isn't mid-edit (typing / dragging)
    const editing=document.activeElement && document.activeElement.closest('#cfgbody');
    if(TAB==='config' && CFG && !BUSY && !editing){
      const sig=JSON.stringify((d.accounts||[]).map(a=>[a.alias,a.token_valid,a.token_username]));
      if(sig!==window._tokSig){ window._tokSig=sig; renderConfig(); }
    }
  }catch(e){}
}
tick(); setInterval(tick,5000);
setInterval(()=>{if(TAB==='log') pullLog();},3000);
</script>
